<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">PARALLAX Agent Operations</title>
  <desc id="desc">Animated multi-agent orchestration graph showing planner, four specialist agents, verifier and synthesis.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080d"/>
      <stop offset=".52" stop-color="#08111a"/>
      <stop offset="1" stop-color="#071017"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="42%" r="65%">
      <stop offset="0" stop-color="#c7fff0"/>
      <stop offset=".18" stop-color="#65f0c5"/>
      <stop offset=".46" stop-color="#20a9a8"/>
      <stop offset=".75" stop-color="#0c4558"/>
      <stop offset="1" stop-color="#07111b"/>
    </radialGradient>
    <linearGradient id="cyanLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39e0c2" stop-opacity=".25"/>
      <stop offset=".55" stop-color="#6de9ff"/>
      <stop offset="1" stop-color="#39e0c2" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="amberLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd36e" stop-opacity=".2"/>
      <stop offset=".5" stop-color="#ffc46b"/>
      <stop offset="1" stop-color="#ffd36e" stop-opacity=".2"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#8fe8ff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <path id="p1" d="M600 315 C520 300 440 230 355 183"/>
    <path id="p2" d="M600 315 C520 315 440 305 355 298"/>
    <path id="p3" d="M600 315 C680 300 760 230 845 183"/>
    <path id="p4" d="M600 315 C680 315 760 305 845 298"/>
    <path id="pv" d="M600 350 C600 395 600 420 600 455"/>
  </defs>

  <rect width="1200" height="600" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="600" rx="18" fill="url(#grid)"/>
  <ellipse cx="600" cy="540" rx="520" ry="110" fill="#163142" opacity=".16"/>
  <path d="M30 118H1170M30 507H1170" stroke="#a9eaff" stroke-opacity=".08"/>
  <path d="M98 78H270M930 78H1102" stroke="#6de9ff" stroke-opacity=".18"/>
  <circle cx="80" cy="78" r="3" fill="#62f2c5" filter="url(#glow)"/>
  <circle cx="1120" cy="78" r="3" fill="#62f2c5" filter="url(#glow)"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="600" y="58" text-anchor="middle" fill="#eff9ff" font-size="29" font-weight="750" letter-spacing="4">PARALLAX // AGENT OPERATIONS</text>
    <text x="600" y="86" text-anchor="middle" fill="#7f93a3" font-size="12" font-weight="650" letter-spacing="2.2">PLANNER → PARALLEL WORKERS → VERIFIER → SYNTHESIS</text>
  </g>

  <g opacity=".9">
    <path d="M600 265C545 245 480 210 355 183" fill="none" stroke="url(#cyanLine)" stroke-width="1.5"/>
    <path d="M590 295C510 296 450 297 355 298" fill="none" stroke="url(#cyanLine)" stroke-width="1.5"/>
    <path d="M600 265C655 245 720 210 845 183" fill="none" stroke="url(#cyanLine)" stroke-width="1.5"/>
    <path d="M610 295C690 296 750 297 845 298" fill="none" stroke="url(#cyanLine)" stroke-width="1.5"/>
    <path d="M600 350V455" fill="none" stroke="url(#amberLine)" stroke-width="1.5"/>
  </g>

  <g fill="#6de9ff" filter="url(#glow)">
    <circle r="3"><animateMotion dur="2.8s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
    <circle r="3"><animateMotion dur="3.1s" begin=".5s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
    <circle r="3"><animateMotion dur="2.7s" begin="1s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
    <circle r="3"><animateMotion dur="3s" begin="1.4s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion></circle>
  </g>
  <circle r="3" fill="#ffc46b" filter="url(#glow)">
    <animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#pv"/></animateMotion>
  </circle>

  <g transform="translate(600 292)">
    <circle r="88" fill="#0a141d" stroke="#214859" stroke-width="1.2"/>
    <circle r="67" fill="none" stroke="#6de9ff" stroke-opacity=".26" stroke-width="1">
      <animate attributeName="r" values="62;72;62" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".2;.65;.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="45" fill="url(#core)" stroke="#78ffe1" stroke-opacity=".75" filter="url(#softGlow)"/>
    <path d="M-18 1L0-19 18 1 0 22Z" fill="none" stroke="#e6fff7" stroke-width="1.5" opacity=".8"/>
    <circle r="5" fill="#e8fff8"/>
    <text y="83" text-anchor="middle" fill="#c9f7ef" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2">ORCHESTRATOR</text>
    <text y="101" text-anchor="middle" fill="#657c8a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="8" letter-spacing="1.4">OBJECTIVE LOCKED / GRAPH ACTIVE</text>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g transform="translate(100 135)">
      <rect width="255" height="95" rx="7" fill="#0b1219" stroke="#244451"/>
      <rect x="1" y="1" width="253" height="93" rx="6" fill="none" stroke="#53e4c2" stroke-opacity=".18">
        <animate attributeName="stroke-opacity" values=".14;.5;.14" dur="3.2s" repeatCount="indefinite"/>
      </rect>
      <circle cx="19" cy="20" r="4" fill="#55eabf"><animate attributeName="opacity" values=".35;1;.35" dur="1.8s" repeatCount="indefinite"/></circle>
      <text x="34" y="24" fill="#d9f4f1" font-size="11" font-weight="750" letter-spacing="1.5">STRATEGY AGENT</text>
      <text x="19" y="49" fill="#6d8595" font-size="9" letter-spacing="1">PRODUCT / TECHNICAL WEDGE</text>
      <rect x="19" y="65" width="155" height="5" rx="2.5" fill="#14252d"/>
      <rect x="19" y="65" width="112" height="5" rx="2.5" fill="#43d9b4"><animate attributeName="width" values="45;135;112;45" dur="4s" repeatCount="indefinite"/></rect>
      <text x="223" y="71" fill="#4f6775" font-size="8" text-anchor="end">ACTIVE</text>
    </g>

    <g transform="translate(100 250)">
      <rect width="255" height="95" rx="7" fill="#0b1219" stroke="#244451"/>
      <rect x="1" y="1" width="253" height="93" rx="6" fill="none" stroke="#65dfff" stroke-opacity=".18">
        <animate attributeName="stroke-opacity" values=".14;.48;.14" begin=".7s" dur="3.4s" repeatCount="indefinite"/>
      </rect>
      <circle cx="19" cy="20" r="4" fill="#68dfff"><animate attributeName="opacity" values=".35;1;.35" begin=".4s" dur="2s" repeatCount="indefinite"/></circle>
      <text x="34" y="24" fill="#d9f4f1" font-size="11" font-weight="750" letter-spacing="1.5">SECURITY AGENT</text>
      <text x="19" y="49" fill="#6d8595" font-size="9" letter-spacing="1">RELIABILITY / FAILURE MODES</text>
      <rect x="19" y="65" width="155" height="5" rx="2.5" fill="#14252d"/>
      <rect x="19" y="65" width="124" height="5" rx="2.5" fill="#5ad9f7"><animate attributeName="width" values="60;145;124;60" begin=".4s" dur="4.4s" repeatCount="indefinite"/></rect>
      <text x="223" y="71" fill="#4f6775" font-size="8" text-anchor="end">ACTIVE</text>
    </g>

    <g transform="translate(845 135)">
      <rect width="255" height="95" rx="7" fill="#0b1219" stroke="#244451"/>
      <rect x="1" y="1" width="253" height="93" rx="6" fill="none" stroke="#65dfff" stroke-opacity=".18">
        <animate attributeName="stroke-opacity" values=".14;.48;.14" begin="1.1s" dur="3.1s" repeatCount="indefinite"/>
      </rect>
      <circle cx="19" cy="20" r="4" fill="#68dfff"><animate attributeName="opacity" values=".35;1;.35" begin=".8s" dur="1.9s" repeatCount="indefinite"/></circle>
      <text x="34" y="24" fill="#d9f4f1" font-size="11" font-weight="750" letter-spacing="1.5">GROWTH AGENT</text>
      <text x="19" y="49" fill="#6d8595" font-size="9" letter-spacing="1">COMMUNITY / DISTRIBUTION</text>
      <rect x="19" y="65" width="155" height="5" rx="2.5" fill="#14252d"/>
      <rect x="19" y="65" width="103" height="5" rx="2.5" fill="#58d8f0"><animate attributeName="width" values="38;128;103;38" begin=".8s" dur="4.1s" repeatCount="indefinite"/></rect>
      <text x="223" y="71" fill="#4f6775" font-size="8" text-anchor="end">ACTIVE</text>
    </g>

    <g transform="translate(845 250)">
      <rect width="255" height="95" rx="7" fill="#0b1219" stroke="#244451"/>
      <rect x="1" y="1" width="253" height="93" rx="6" fill="none" stroke="#53e4c2" stroke-opacity=".18">
        <animate attributeName="stroke-opacity" values=".14;.5;.14" begin="1.5s" dur="3.3s" repeatCount="indefinite"/>
      </rect>
      <circle cx="19" cy="20" r="4" fill="#55eabf"><animate attributeName="opacity" values=".35;1;.35" begin="1.2s" dur="2.1s" repeatCount="indefinite"/></circle>
      <text x="34" y="24" fill="#d9f4f1" font-size="11" font-weight="750" letter-spacing="1.5">LAUNCH AGENT</text>
      <text x="19" y="49" fill="#6d8595" font-size="9" letter-spacing="1">EXECUTION / ROLLOUT</text>
      <rect x="19" y="65" width="155" height="5" rx="2.5" fill="#14252d"/>
      <rect x="19" y="65" width="134" height="5" rx="2.5" fill="#43d9b4"><animate attributeName="width" values="55;150;134;55" begin="1.1s" dur="4.5s" repeatCount="indefinite"/></rect>
      <text x="223" y="71" fill="#4f6775" font-size="8" text-anchor="end">ACTIVE</text>
    </g>
  </g>

  <g transform="translate(478 445)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect width="244" height="58" rx="7" fill="#101319" stroke="#7c6336"/>
    <circle cx="18" cy="17" r="4" fill="#ffc46b" filter="url(#glow)"><animate attributeName="opacity" values=".35;1;.35" dur="1.5s" repeatCount="indefinite"/></circle>
    <text x="34" y="21" fill="#ffdda0" font-size="10" font-weight="750" letter-spacing="1.6">ADVERSARIAL VERIFIER</text>
    <text x="18" y="42" fill="#7e725d" font-size="8" letter-spacing=".9">CONFLICTS / OMISSIONS / REPAIR</text>
  </g>

  <g transform="translate(390 530)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect width="420" height="42" rx="7" fill="#0b1519" stroke="#2f5b55"/>
    <text x="18" y="26" fill="#78f0cf" font-size="10" font-weight="750" letter-spacing="1.8">SYNTHESIS</text>
    <text x="122" y="26" fill="#657d88" font-size="8.5" letter-spacing="1.1">VERIFIED ARTIFACT → FINAL MISSION RESULT</text>
    <circle cx="395" cy="21" r="4" fill="#55eabf"><animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;.2;.9" dur="2s" repeatCount="indefinite"/></circle>
  </g>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="8" fill="#405866">
    <text x="34" y="572">LIVE MULTI-AGENT ORCHESTRATION</text>
    <text x="1166" y="572" text-anchor="end">PARALLEL WIDTH 04 / VERIFICATION GATE ENABLED</text>
  </g>
</svg>