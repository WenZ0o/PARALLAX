<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <rect width="1200" height="520" fill="#07090d"/>
  <defs>
    <style>
      .box{fill:#0e1219;stroke:#2a3441;stroke-width:2}.accent{stroke:#4ee69c}.review{stroke:#ffc46b}.t{fill:#e9eff6;font:700 18px monospace}.s{fill:#758195;font:13px monospace}.e{fill:none;stroke:#35404d;stroke-width:2}
    </style>
  </defs>
  <text x="60" y="62" class="t">PARALLAX / EXECUTION GRAPH</text>
  <text x="60" y="88" class="s">A bounded, inspectable multi-agent pipeline</text>
  <path class="e" d="M230 255H330M480 255H560M760 255H850M1010 255H1090"/>
  <path class="e" d="M480 255C520 255 515 150 560 150M480 255C520 255 515 200 560 200M480 255C520 255 515 310 560 310M480 255C520 255 515 360 560 360"/>
  <path class="e" d="M730 150C790 150 790 255 850 255M730 200C790 200 790 255 850 255M730 310C790 310 790 255 850 255M730 360C790 360 790 255 850 255"/>
  <rect x="60" y="220" width="170" height="70" rx="5" class="box accent"/><text x="85" y="250" class="t">BRIEF</text><text x="85" y="272" class="s">freeze scope</text>
  <rect x="330" y="220" width="150" height="70" rx="5" class="box accent"/><text x="355" y="250" class="t">PLAN</text><text x="355" y="272" class="s">spawn graph</text>
  <rect x="560" y="120" width="170" height="55" rx="5" class="box"/><text x="582" y="153" class="t">SIGNAL</text>
  <rect x="560" y="180" width="170" height="55" rx="5" class="box"/><text x="582" y="213" class="t">SYSTEMS</text>
  <rect x="560" y="285" width="170" height="55" rx="5" class="box"/><text x="582" y="318" class="t">RED TEAM</text>
  <rect x="560" y="345" width="170" height="55" rx="5" class="box"/><text x="582" y="378" class="t">EXECUTION</text>
  <rect x="850" y="220" width="160" height="70" rx="5" class="box review"/><text x="875" y="250" class="t">VERIFY</text><text x="875" y="272" class="s">adversarial gate</text>
  <rect x="1090" y="220" width="90" height="70" rx="5" class="box accent"/><text x="1107" y="250" class="t" font-size="14">MERGE</text><text x="1107" y="272" class="s">artifact</text>
  <text x="560" y="440" class="s">Workers are isolated. The verifier can reject and request bounded repair before synthesis.</text>
